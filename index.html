<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наш класс — выпуск 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Georgia, serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #0a0618;
    transition: background 0.8s ease;
    overflow-x: hidden;
    position: relative;
  }

  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .particle {
    position: absolute;
    bottom: -50px;
    font-size: 22px;
    opacity: 0;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 6px rgba(200, 180, 255, 0.7));
  }
  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% {
      transform: translateY(-110vh) rotate(360deg);
      opacity: 0;
    }
  }

  .card {
    background: rgba(10, 6, 24, 0.7);
    border: 1px solid rgba(140, 160, 255, 0.3);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 460px;
    width: 100%;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6),
                0 0 80px rgba(120, 140, 255, 0.2);
    position: relative;
    z-index: 1;
  }

  .photo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .arrow {
    background: rgba(120, 140, 255, 0.15);
    border: 1px solid rgba(140, 160, 255, 0.4);
    color: #c8b6ff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .arrow:hover {
    background: rgba(140, 160, 255, 0.35);
    color: #fff;
    box-shadow: 0 0 18px rgba(140, 160, 255, 0.6);
    transform: scale(1.1);
  }

  .photo-wrap {
    width: 240px;
    height: 240px;
    animation: breathing 5s ease-in-out infinite;
  }
  @keyframes breathing {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .photo-face {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid rgba(160, 180, 255, 0.6);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5),
                0 0 40px rgba(120, 140, 255, 0.4),
                inset 0 0 20px rgba(120, 140, 255, 0.15);
    transition: box-shadow 0.6s, transform 0.4s;
  }
  .photo-wrap.zooming .photo-face {
    transform: scale(1.06);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6),
                0 0 60px rgba(160, 180, 255, 0.7);
  }
  .photo-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thumbs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .thumb {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid rgba(140, 160, 255, 0.3);
    opacity: 0.5;
    transition: all 0.3s;
  }
  .thumb:hover { opacity: 0.85; transform: translateY(-3px); }
  .thumb.active {
    opacity: 1;
    border-color: #a8bbff;
    transform: scale(1.1);
    box-shadow: 0 0 18px rgba(160, 180, 255, 0.7);
  }

  .name {
    font-size: clamp(15px, 5.5vw, 26px);
    text-align: center;
    margin-bottom: 12px;
    color: #c8d4ff;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .quote {
    font-style: italic;
    text-align: center;
    color: #ffffff;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 18px;
    padding: 8px 12px;
    text-shadow: 0 0 12px rgba(160, 180, 255, 0.6),
                 0 0 4px rgba(200, 180, 255, 0.4);
  }
  .quote::before { content: "«"; color: #a8bbff; }
  .quote::after  { content: "»"; color: #a8bbff; }

  .wish {
    background: rgba(140, 160, 255, 0.08);
    border: 1px solid rgba(140, 160, 255, 0.25);
    border-left: 3px solid #a8bbff;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 13.5px;
    line-height: 1.6;
    color: #c8cee8;
  }
  .wish-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #a8bbff;
    margin-bottom: 6px;
  }

  .playlist {
    list-style: none;
    margin-bottom: 18px;
    border-top: 1px solid rgba(140, 160, 255, 0.15);
    padding-top: 12px;
  }
  .playlist li {
    padding: 10px 14px;
    margin-bottom: 6px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: #d0d0e8;
    background: rgba(140, 160, 255, 0.06);
    border: 1px solid transparent;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .playlist li::before {
    content: "♪";
    color: #a8bbff;
    font-size: 16px;
  }
  .playlist li:hover {
    background: rgba(140, 160, 255, 0.18);
    color: #fff;
    transform: translateX(4px);
  }
  .playlist li.playing {
    background: linear-gradient(90deg, rgba(140, 160, 255, 0.3), rgba(200, 180, 255, 0.1));
    color: #fff;
    border-color: rgba(160, 180, 255, 0.5);
    box-shadow: 0 0 18px rgba(140, 160, 255, 0.3);
  }
  .playlist li.playing::before {
    content: "▶";
    color: #ff7ba8;
  }

  audio {
    width: 100%;
    margin-bottom: 16px;
    border-radius: 30px;
    filter: invert(0.88) hue-rotate(210deg) saturate(1.6);
  }

  .nav { display: flex; gap: 10px; }
  .nav button {
    flex: 1;
    padding: 12px;
    border: 1px solid rgba(140, 160, 255, 0.3);
    background: rgba(140, 160, 255, 0.08);
    color: #fff;
    border-radius: 14px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .nav button:hover:not(:disabled) {
    background: rgba(140, 160, 255, 0.25);
    box-shadow: 0 0 20px rgba(140, 160, 255, 0.4);
  }
  .nav button:disabled { opacity: 0.3; cursor: default; }

  .counter {
    text-align: center;
    color: #8888aa;
    font-size: 12px;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="card">
  <div class="photo-row">
    <div class="arrow" onclick="changePhoto(-1)">‹</div>
    <div class="photo-wrap" id="photoWrap">
      <div class="photo-face">
        <img id="photo" src="" alt="">
      </div>
    </div>
    <div class="arrow" onclick="changePhoto(1)">›</div>
  </div>

  <div class="thumbs" id="thumbs"></div>

  <div class="name" id="name"></div>
  <div class="quote" id="quote"></div>

  <div class="wish">
    <div class="wish-title">Пожелание классу</div>
    <div id="wishText"></div>
  </div>

  <ul class="playlist" id="playlist"></ul>

  <audio id="player" controls preload="none"></audio>

  <div class="nav">
    <button id="prev" onclick="prev()">← Назад</button>
    <button id="next" onclick="next()">Вперёд →</button>
  </div>
  <div class="counter" id="counter"></div>
</div>

<script>
// ============ ДАННЫЕ УЧЕНИКОВ ============
const students = [
  {
    name: "Алтана Батомункуева",
    quote: "Игнорирую недостойных",
    wish: "Желаю, чтобы школа запомнилась не только оценками в дневнике, но и крутыми моментами, верными друзьями и классными переменами.",
    photos: ["img/1.jpg", "img/1b.jpg", "img/1c.jpg"],
    songs: [
      { title: "80soperl — Runaway Runaway", file: "music/1.mp3" },
      { title: "Иван Дорн — Стыцамен", file: "music/1b.mp3" },
      { title: "Blood Orange — Champagne Coast", file: "music/1c.mp3" }
    ],
    bg: "url('img/bg-1.jpg') center/cover no-repeat fixed"
  }
];

let current = 0;
let photoIndex = 0;
let currentSong = 0;
let autoTimer = null;

const photoEl      = document.getElementById("photo");
const photoWrap    = document.getElementById("photoWrap");
const thumbsEl     = document.getElementById("thumbs");
const nameEl       = document.getElementById("name");
const quoteEl      = document.getElementById("quote");
const wishEl       = document.getElementById("wishText");
const playlistEl   = document.getElementById("playlist");
const playerEl     = document.getElementById("player");
const prevBtn      = document.getElementById("prev");
const nextBtn      = document.getElementById("next");
const counterEl    = document.getElementById("counter");

function render() {
  const s = students[current];
  photoIndex = 0;
  currentSong = 0;

  document.body.style.background = s.bg;
  document.body.style.backgroundAttachment = "fixed";

  nameEl.textContent = s.name;
  quoteEl.textContent = s.quote;
  wishEl.textContent = s.wish;

  renderPhoto(true);
  renderThumbs();
  renderPlaylist();

  playerEl.src = s.songs[0].file;
  playerEl.load();

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === students.length - 1;
  counterEl.textContent = (current + 1) + " из " + students.length;

  startAuto();
}

function renderPhoto(zoom) {
  const s = students[current];
  photoEl.src = s.photos[photoIndex];
  if (zoom) {
    photoWrap.classList.add("zooming");
    setTimeout(() => photoWrap.classList.remove("zooming"), 450);
  }
}

function renderThumbs() {
  const s = students[current];
  thumbsEl.innerHTML = "";
  s.photos.forEach((p, i) => {
    const img = document.createElement("img");
    img.src = p;
    img.className = "thumb" + (i === photoIndex ? " active" : "");
    img.onclick = (e) => {
      e.stopPropagation();
      photoIndex = i;
      renderPhoto(true);
      renderThumbs();
      startAuto();
    };
    thumbsEl.appendChild(img);
  });
}

function renderPlaylist() {
  const s = students[current];
  playlistEl.innerHTML = "";
  s.songs.forEach((song, i) => {
    const li = document.createElement("li");
    li.textContent = song.title;
    if (i === currentSong) li.classList.add("playing");
    li.onclick = () => {
      currentSong = i;
      playerEl.src = song.file;
      playerEl.load();
      playerEl.play();
      renderPlaylist();
    };
    playlistEl.appendChild(li);
  });
}

function changePhoto(dir) {
  const s = students[current];
  photoIndex = (photoIndex + dir + s.photos.length) % s.photos.length;
  renderPhoto(true);
  renderThumbs();
  startAuto();
}

function startAuto() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    const s = students[current];
    if (s.photos.length < 2) return;
    photoIndex = (photoIndex + 1) % s.photos.length;
    renderPhoto(true);
    renderThumbs();
  }, 5000);
}

function prev() { if (current > 0) { current--; render(); } }
function next() { if (current < students.length - 1) { current++; render(); } }

// ============ ЛЕТЯЩИЕ ЧАСТИЦЫ ============
function createParticles() {
  const container = document.getElementById("particles");
  const symbols = ["❤", "♥", "★", "✦", "✧", "♡", "☆"];
  const count = 22;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = Math.random() * 100 + "%";
    p.style.fontSize = (14 + Math.random() * 20) + "px";
    p.style.animationDuration = (10 + Math.random() * 14) + "s";
    p.style.animationDelay = (Math.random() * 12) + "s";
    const colors = ["#ff7ba8", "#c8b6ff", "#a8bbff", "#ffd6e8", "#e0d4ff"];
    p.style.color = colors[Math.floor(Math.random() * colors.length)];
    container.appendChild(p);
  }
}

createParticles();
render();
</script>

</body>
</html>
